name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
  workflow_dispatch:

jobs:
  define-version:
    name: Define version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_draft.outputs.version || steps.canary.outputs.version || steps.testing.outputs.version }}
      version-type: ${{ steps.release_draft.outputs.version_type || steps.canary.outputs.version_type || steps.testing.outputs.version_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Get Release Draft version
        id: release_draft
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        run: |
          echo "version_type=draft" >> $GITHUB_OUTPUT
          version=${{ github.ref_name }}
          echo "version=${version#v}" >> $GITHUB_OUTPUT
        
      - name: Get Canary version
        id: canary
        if: ${{ !steps.release_draft.outputs.version && github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch }}
        run: |
          echo "version_type=canary" >> $GITHUB_OUTPUT
          version=$(git describe --tags --long --exclude '*-*' 2>/dev/null || echo "v0.0.0-$(git rev-list --count HEAD)-g$(git rev-parse --short HEAD)")
          echo "version=${version#v}" >> $GITHUB_OUTPUT

      - name: Get Testing version
        id: testing
        if: ${{ !steps.release_draft.outputs.version && !steps.canary.outputs.version }}
        run: |
          echo "version_type=testing" >> $GITHUB_OUTPUT
          branch=$(git rev-parse --abbrev-ref HEAD)
          version=$(git describe --tags --long --exclude '*-*' 2>/dev/null || echo "v0.0.0-$(git rev-list --count HEAD)-g$(git rev-parse --short HEAD)")
          echo "version=${version#v}-${branch//\//-}" >> $GITHUB_OUTPUT

  linter-checks:
    name: Run clang-format and clang-tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Conan
        uses: conan-io/setup-conan@v1

      - name: Install Conan dependencies
        run: |
          conan install . \
          -o "&:with_clang_tools=True" \
          -b=missing \
          -s compiler.cppstd=23 \
          -s compiler.version=14 \
          -c 'tools.build:compiler_executables={"c": "gcc-14", "cpp": "g++-14"}'

      - name: Activate buildenv
        run: source ./build/Release/generators/conanbuild.sh

      - name: Configure CMake
        run: cmake --preset conan-release

      - name: Run clang-format
        run: cmake --build --preset conan-release --target clang_format_validate

      - name: Run clang-tidy
        run: cmake --build --preset conan-release --target clang_tidy_validate

  make-docs:
    name: Make Documentation
    runs-on: ubuntu-latest
    needs: define-version
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Conan
        uses: conan-io/setup-conan@v1

      - name: Install Conan dependencies
        run: conan install . -o "&:with_docs=True" -b=missing -s compiler.cppstd=23  --version=${{ needs.define-version.outputs.version }}

      - name: Activate buildenv
        run: source ./build/Release/generators/conanbuild.sh

      - name: Configure CMake
        run: cmake --preset conan-release

      - name: Build docs target
        run: cmake --build --preset conan-release --target docs

      - name: Install Documentation component
        run: cmake --install build/Release --prefix ./artifacts --component Documentation

      - name: Upload docs files as artifact
        id: upload
        uses: actions/upload-artifact@v6
        with:
          name: libopenpresso-docs-${{ needs.define-version.outputs.version }}
          path: ./artifacts/docs

  upload-sources:
    name: Upload sources to conan remote
    runs-on: ubuntu-latest
    needs: [ define-version, linter-checks ]
    if: ${{ github.repository == 'openpresso/libopenpresso' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Conan
        uses: conan-io/setup-conan@v1

      - name: Export to local cache
        run: conan export . --version=${{ needs.define-version.outputs.version }}

      - name: Upload to remote
        run: |
          conan remote add openpresso https://conan.cloudsmith.io/openpresso/${{ needs.define-version.outputs.version-type }}
          conan remote login -p ${{ secrets.CONAN_DEPLOY_KEY }} openpresso openpresso-ci
          conan upload libopenpresso/${{ needs.define-version.outputs.version }} --confirm -r openpresso

  cross-compile:
    name: Cross-compile binaries for ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: [ define-version, linter-checks ]
    strategy:
      matrix:
        target: [ armv6, armv8, x86_64 ]
    container: ghcr.io/openpresso/openpresso-toolchain-${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Copy conan config from root user
        run: cp -r /root/.conan2 ~/.conan2

      - name: Create binary package
        run: conan create . --version=${{ needs.define-version.outputs.version }} --build=missing

      - name: Install to artifacts folder
        run: conan install --requires="libopenpresso/${{ needs.define-version.outputs.version }}" --deployer-package="libopenpresso/*" --output-folder=./artifacts --envs-generation=false

      - name: Upload built artifact
        uses: actions/upload-artifact@v6
        with:
          name: libopenpresso-${{ matrix.target }}-${{ needs.define-version.outputs.version }}
          path: ./artifacts

      - name: Upload to remote
        if: ${{ github.repository == 'openpresso/libopenpresso' }}
        run: |
          conan remote add openpresso https://conan.cloudsmith.io/openpresso/${{ needs.define-version.outputs.version-type }}
          conan remote login -p ${{ secrets.CONAN_DEPLOY_KEY }} openpresso openpresso-ci
          conan upload libopenpresso/${{ needs.define-version.outputs.version }} --confirm -r openpresso

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: [ make-docs, define-version, linter-checks ]
    if: ${{ needs.define-version.outputs.version-type == 'canary' && github.repository == 'openpresso/libopenpresso' }}
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v7
        with:
          name: libopenpresso-docs-${{ needs.define-version.outputs.version }}
          path: ./docs

      - name: Deploy docs
        uses: openpresso/openpresso.github.io/.github/actions/deploy-docs@gh-pages
        with:
          commit_message: "[CI] Libopenpresso docs deployed: ${{ github.event.head_commit.message }}"
          repository: openpresso/openpresso.github.io
          deployment_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          source_dir: ./docs
          target_dir: libopenpresso
          checkout_path: pages
          version: ${{ needs.define-version.outputs.version }}
          verion_type: 'canary'

  release-draft:
    name: Create release draft
    runs-on: ubuntu-latest
    needs: [ define-version, make-docs, cross-compile ]
    if: ${{ needs.define-version.outputs.version-type == 'draft' && github.repository == 'openpresso/libopenpresso' }}
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Archive artifacts
        run: |
          mkdir release-assets
          for dir in artifacts/*/; do 
            name=$(basename "${dir%/}")
            (cd "$dir" && zip -r "../../release-assets/${name}.zip" .)
          done

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          files: release-assets/*

      
